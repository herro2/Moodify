<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodify</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      min-height: 100%;
    }

    body {
      background: #05040A;
      font-family: 'Syne', sans-serif;
      color: white;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .fi {
      animation: fadein 0.45s ease both;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const {
      RadarChart, Radar, PolarGrid, PolarAngleAxis,
      PieChart, Pie, Cell,
      AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer
    } = Recharts;

    // byt ut mot ditt client id från spotify dashboard
    const CLIENT_ID = '7eea2c95553c4c87b75e3a1fd8ca1a12';
    const REDIRECT_URI = https://herro2.github.io/Moodify/;
    const SCOPES = 'user-top-read user-read-recently-played user-read-private user-read-email';

    // --- PKCE auth helpers ---

    function randStr(len) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const buf = new Uint8Array(len);
      crypto.getRandomValues(buf);
      return Array.from(buf, x => chars[x % chars.length]).join('');
    }

    async function makeChallenge(verifier) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=/g, '');
    }

    async function startLogin() {
      const verifier = randStr(64);
      localStorage.setItem('mfy_v', verifier);
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        code_challenge_method: 'S256',
        code_challenge: await makeChallenge(verifier),
        scope: SCOPES,
        show_dialog: 'false',
      });
      window.location.href = 'https://accounts.spotify.com/authorize?' + params;
    }

    // ger bättre felmeddelanden beroende på vad spotify svarar
    function parseSpotifyError(body, status) {
      const msg = body.error_description || body.error || '';
      if (status === 403 || msg.includes('403')) {
        return `403 Forbidden — redirect URI stämmer inte. Appen skickar: "${REDIRECT_URI}". Kontrollera att exakt denna URI är inlagd i Spotify Dashboard.`;
      }
      if (msg.includes('invalid_client')) return 'Ogiltigt Client ID. Dubbelkolla att CLIENT_ID stämmer.';
      if (msg.includes('invalid_grant')) return 'Koden har använts eller gått ut. Försök logga in igen.';
      if (msg.includes('not_found') || status === 404) return 'Appen hittades inte. Kontrollera Client ID.';
      return msg || `Spotify svarade med fel ${status}`;
    }

    async function exchangeCode(code) {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: localStorage.getItem('mfy_v'),
        }),
      });
      const body = await res.json();
      if (!body.access_token) throw new Error(parseSpotifyError(body, res.status));
      saveTokens(body);
      localStorage.removeItem('mfy_v');
      window.history.replaceState({}, '', window.location.pathname);
      return body.access_token;
    }

    async function refreshToken() {
      const rt = localStorage.getItem('mfy_rt');
      if (!rt) throw new Error('Ingen refresh token sparad');
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'refresh_token',
          refresh_token: rt,
        }),
      });
      const body = await res.json();
      if (!body.access_token) throw new Error(parseSpotifyError(body, res.status));
      saveTokens(body);
      return body.access_token;
    }

    function saveTokens({ access_token, expires_in, refresh_token }) {
      localStorage.setItem('mfy_at', access_token);
      localStorage.setItem('mfy_exp', Date.now() + expires_in * 1000);
      if (refresh_token) localStorage.setItem('mfy_rt', refresh_token);
    }

    async function getToken() {
      const at = localStorage.getItem('mfy_at');
      const exp = parseInt(localStorage.getItem('mfy_exp') || 0);
      // lite marginal så vi inte skickar en token som löper ut mitt i ett anrop
      if (at && Date.now() < exp - 60000) return at;
      try {
        return await refreshToken();
      } catch {
        clearAuth();
        return null;
      }
    }

    function clearAuth() {
      ['mfy_at', 'mfy_exp', 'mfy_rt', 'mfy_v'].forEach(k => localStorage.removeItem(k));
    }

    // --- spotify api wrapper ---

    async function apiFetch(token, path) {
      const res = await fetch('https://api.spotify.com/v1' + path, {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (res.status === 401) {
        clearAuth();
        throw new Error('Session utgången — logga in igen');
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'HTTP ' + res.status);
      }
      return res.json();
    }

    // hämtar allt vi behöver i parallell för att spara tid
    async function loadAll(token, onStatus, timeRange, recentHours) {
      const rangeLabel = {
        short_term: '4 veckor',
        medium_term: '6 månader',
        long_term: 'alla tider'
      }[timeRange] || timeRange;

      onStatus('Hämtar topplåtar (' + rangeLabel + ')...');

      const [me, topTracks, topArtists, recentRaw] = await Promise.all([
        apiFetch(token, '/me'),
        apiFetch(token, '/me/top/tracks?time_range=' + timeRange + '&limit=50'),
        apiFetch(token, '/me/top/artists?time_range=' + timeRange + '&limit=50'),
        apiFetch(token, '/me/player/recently-played?limit=50').catch(() => ({ items: [] })),
      ]);

      onStatus('Bearbetar musikdata...');

      let recentItems = recentRaw.items || [];
      if (recentHours) {
        const cutoff = Date.now() - recentHours * 3600 * 1000;
        recentItems = recentItems.filter(i => i.played_at && new Date(i.played_at).getTime() > cutoff);
      }

      return { me, topTracks, topArtists, recent: { items: recentItems } };
    }

    // --- mood beräkning baserat på genre ---
    // varje genre mappas till [energi, glädje, dansbarhet, akustisk, komplexitet]
    const GENRE_MOODS = {
      'pop':          [0.65, 0.75, 0.72, 0.25, 0.30],
      'dance':        [0.82, 0.72, 0.88, 0.10, 0.35],
      'edm':          [0.88, 0.65, 0.84, 0.05, 0.50],
      'electronic':   [0.78, 0.58, 0.75, 0.08, 0.60],
      'house':        [0.80, 0.68, 0.85, 0.08, 0.45],
      'techno':       [0.85, 0.45, 0.80, 0.05, 0.65],
      'hip hop':      [0.72, 0.62, 0.82, 0.12, 0.55],
      'rap':          [0.74, 0.58, 0.80, 0.10, 0.60],
      'trap':         [0.76, 0.50, 0.78, 0.08, 0.55],
      'r&b':          [0.58, 0.68, 0.72, 0.28, 0.50],
      'rock':         [0.78, 0.52, 0.55, 0.22, 0.55],
      'metal':        [0.90, 0.35, 0.45, 0.08, 0.72],
      'punk':         [0.88, 0.50, 0.60, 0.15, 0.48],
      'indie':        [0.55, 0.58, 0.58, 0.48, 0.62],
      'alternative':  [0.60, 0.52, 0.55, 0.38, 0.60],
      'post-rock':    [0.60, 0.42, 0.35, 0.40, 0.80],
      'math rock':    [0.65, 0.48, 0.40, 0.35, 0.88],
      'ambient':      [0.22, 0.48, 0.28, 0.68, 0.72],
      'classical':    [0.30, 0.62, 0.28, 0.88, 0.82],
      'jazz':         [0.42, 0.65, 0.58, 0.72, 0.85],
      'blues':        [0.48, 0.52, 0.55, 0.65, 0.68],
      'folk':         [0.38, 0.62, 0.48, 0.80, 0.58],
      'country':      [0.52, 0.65, 0.58, 0.72, 0.42],
      'soul':         [0.52, 0.70, 0.65, 0.55, 0.60],
      'funk':         [0.72, 0.72, 0.82, 0.30, 0.65],
      'latin':        [0.72, 0.75, 0.85, 0.30, 0.45],
      'reggae':       [0.52, 0.72, 0.75, 0.55, 0.42],
      'lo-fi':        [0.28, 0.55, 0.55, 0.65, 0.58],
      'experimental': [0.55, 0.38, 0.42, 0.40, 0.90],
      'shoegaze':     [0.55, 0.42, 0.38, 0.45, 0.75],
    };

    function getGenreWeights(topArtists) {
      const en = [], ha = [], da = [], ac = [], cx = [];
      for (const artist of topArtists.items || []) {
        for (const genre of artist.genres || []) {
          const g = genre.toLowerCase();
          for (const [kw, weights] of Object.entries(GENRE_MOODS)) {
            if (g.includes(kw)) {
              en.push(weights[0]);
              ha.push(weights[1]);
              da.push(weights[2]);
              ac.push(weights[3]);
              cx.push(weights[4]);
              break;
            }
          }
        }
      }
      const avg = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0.5;
      return { en: avg(en), ha: avg(ha), da: avg(da), ac: avg(ac), cx: avg(cx) };
    }

    function calcMood(topArtists, mainstreamnessScore) {
      const w = getGenreWeights(topArtists);
      // populärare lyssnare tenderar vara lite gladare/mer dansanta
      const boost = (mainstreamnessScore / 100) * 0.08;
      return {
        happiness:    Math.round(Math.min(1, w.ha + boost) * 100),
        energy:       Math.round(Math.min(1, w.en) * 100),
        sadness:      Math.round(((1 - w.ha) * 0.6 + (1 - w.en) * 0.4) * 100),
        focus:        Math.round((w.cx * 0.55 + w.ac * 0.25 + (1 - w.da) * 0.2) * 100),
        danceability: Math.round(Math.min(1, w.da + boost * 0.5) * 100),
        aggression:   Math.round((w.en * 0.45 + (1 - w.ha) * 0.35 + (1 - w.ac) * 0.2) * 100),
        chill:        Math.round((w.ac * 0.45 + (1 - w.en) * 0.35 + w.ha * 0.2) * 100),
      };
    }

    function getRadarData(topArtists, ms) {
      const w = getGenreWeights(topArtists);
      return [
        { s: 'Melodic',    A: Math.round(((1 - w.en) * 0.5 + w.ha * 0.5) * 100) },
        { s: 'Intense',    A: Math.round((w.en * 0.6 + (1 - w.ac) * 0.4) * 100) },
        { s: 'Electronic', A: Math.round((1 - w.ac) * 100) },
        { s: 'Acoustic',   A: Math.round(w.ac * 100) },
        { s: 'Complex',    A: Math.round(w.cx * 100) },
        { s: 'Mainstream', A: Math.round(ms) },
      ];
    }

    // gruppar genrer i bredare kategorier
    const GENRE_BUCKETS = {
      'Pop':        ['pop', 'chart', 'teen', 'viral'],
      'Rock':       ['rock', 'metal', 'punk', 'grunge', 'emo', 'hardcore'],
      'Electronic': ['electronic', 'electro', 'techno', 'house', 'edm', 'synth', 'trance', 'dubstep', 'ambient', 'idm', 'dnb', 'drum'],
      'Hip-Hop':    ['hip hop', 'hip-hop', 'rap', 'trap', 'drill', 'r&b', 'rnb'],
      'Indie Alt':  ['indie', 'alternative', 'lo-fi', 'lo fi', 'shoegaze', 'dreampop'],
      'Post-Rock':  ['post-rock', 'post rock', 'math rock', 'post metal', 'noise rock', 'experimental'],
      'Folk':       ['folk', 'singer-songwriter', 'acoustic', 'country', 'americana'],
      'Jazz/Blues': ['jazz', 'blues', 'funk', 'soul', 'gospel'],
    };

    function getGenreData(topArtists) {
      const counts = {};
      for (const artist of topArtists.items || []) {
        for (const genre of artist.genres || []) {
          const g = genre.toLowerCase();
          for (const [bucket, keywords] of Object.entries(GENRE_BUCKETS)) {
            if (keywords.some(k => g.includes(k))) {
              counts[bucket] = (counts[bucket] || 0) + 1;
              break;
            }
          }
        }
      }
      const total = Math.max(1, Object.values(counts).reduce((s, v) => s + v, 0));
      const COLORS = [PU, CY, G, OR, PK, '#888'];
      return Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6)
        .map(([name, val], i) => ({
          name,
          value: Math.round((val / total) * 100),
          color: COLORS[i],
        }));
    }

    function getTrendData(items) {
      const dayNames = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
      const byDay = {};
      for (const item of items || []) {
        if (!item.played_at || !item.track) continue;
        const d = new Date(item.played_at);
        const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (!byDay[key]) byDay[key] = { label: dayNames[d.getDay()], pops: [] };
        byDay[key].pops.push(item.track.popularity || 50);
      }
      return Object.entries(byDay)
        .sort(([a], [b]) => a.localeCompare(b))
        .slice(-7)
        .map(([, day]) => {
          const avg = day.pops.reduce((s, p) => s + p, 0) / day.pops.length;
          return {
            day: day.label,
            energy: Math.round(40 + avg * 0.55),
            happiness: Math.round(35 + avg * 0.6),
          };
        });
    }

    function getMainstream(topArtists) {
      const artists = topArtists.items || [];
      if (!artists.length) return 50;
      return Math.round(artists.reduce((s, a) => s + a.popularity, 0) / artists.length);
    }

    function getPersonalityText(m, ms) {
      const time = m.energy > 65 ? 'dagslyssnare' : 'nattlyssnare';
      const type = m.focus > 55 ? 'analytisk' : 'känslodriven';
      const mainstream = ms < 35
        ? 'undviker mainstream med precision'
        : ms < 65
          ? 'balanserar mainstream och nisch'
          : 'embracar populärkultur';
      const vibe = m.energy > 70 ? 'hög intensitet' : m.chill > 65 ? 'lugn och atmosfärisk stil' : 'varierad dynamik';
      const depth = m.focus > 60 ? 'emotionellt komplex musik' : 'välproducerad melodisk musik';
      return `Du är en ${type} ${time} som ${mainstream} och graviterar mot ${depth} med ${vibe}.`;
    }

    function getTags(m, ms) {
      return [
        m.energy > 70 ? 'Hög energi' : m.chill > 60 ? 'Chill lyssnare' : 'Balanserad',
        ms < 35 ? 'Anti-mainstream' : ms > 70 ? 'Mainstream' : 'Nisch-nörd',
        m.focus > 60 ? 'Komplex smak' : 'Melodisk smak',
        m.happiness > 60 ? 'Positiv vibe' : 'Mörk vibe',
      ];
    }

    function getFunStats(topTracks, topArtists, ms) {
      const tracks = topTracks.items || [];
      const artists = topArtists.items || [];
      const leastPopular = [...tracks].sort((a, b) => a.popularity - b.popularity)[0];
      const mostPopular = [...tracks].sort((a, b) => b.popularity - a.popularity)[0];
      const obscureArtist = [...artists].sort((a, b) => a.popularity - b.popularity)[0];
      const hiddenGem = Math.round((1 - ms / 100) * 100);
      const musicIQ = Math.min(160, Math.round(80 + hiddenGem * 0.55 + (100 - ms) * 0.25));
      return [
        { label: 'Mainstream %',     value: `${ms}%`,                 sub: ms < 40 ? 'Indie af' : ms < 70 ? 'Balanced' : 'Mainstream enjoyer', color: CY },
        { label: 'Hidden Gem Score', value: String(hiddenGem),        sub: hiddenGem > 70 ? 'Top underground' : 'Underground nörd',             color: PU },
        { label: 'Musik-IQ',         value: String(musicIQ),          sub: 'Komplexitetsnörd',                                                  color: G  },
        { label: 'Minst populär',    value: leastPopular?.name || '—', sub: leastPopular ? (leastPopular.artists[0]?.name || '') : '',           color: PK },
        { label: 'Mest populär',     value: mostPopular?.name || '—', sub: mostPopular ? (mostPopular.artists[0]?.name || '') : '',              color: OR },
        { label: 'Mest ovanliga',    value: obscureArtist?.name || '—', sub: obscureArtist ? `${obscureArtist.popularity}% popularitet` : '',   color: '#FF4444' },
      ];
    }

    // designfärger
    const G = '#1DB954';
    const CY = '#00D9F5';
    const PU = '#B026FF';
    const PK = '#FF2D78';
    const OR = '#FF6B35';

    const MOOD_ITEMS = [
      { key: 'happiness',    label: 'Happiness',    color: G,         icon: '☀'  },
      { key: 'energy',       label: 'Energy',       color: OR,        icon: '⚡' },
      { key: 'sadness',      label: 'Sadness',      color: CY,        icon: '🌧' },
      { key: 'focus',        label: 'Focus',        color: PU,        icon: '◎'  },
      { key: 'danceability', label: 'Danceability', color: PK,        icon: '♫'  },
      { key: 'aggression',   label: 'Aggression',   color: '#FF4444', icon: '🔥' },
      { key: 'chill',        label: 'Chill',        color: '#44DDBB', icon: '✦'  },
    ];

    // --- komponenter ---

    function Ring({ val, color, size = 80 }) {
      const r = (size - 12) / 2;
      const circumference = 2 * Math.PI * r;
      const filled = (val / 100) * circumference;
      return (
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none"
            stroke="rgba(255,255,255,0.07)" strokeWidth={6} />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none"
            stroke={color} strokeWidth={6}
            strokeDasharray={`${filled} ${circumference - filled}`}
            strokeLinecap="round"
            style={{ transition: 'stroke-dasharray 1.3s cubic-bezier(0.34,1.56,0.64,1)' }} />
        </svg>
      );
    }

    function MoodCard({ item, idx, value }) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const t = setTimeout(() => setVisible(true), 150 + idx * 70);
        return () => clearTimeout(t);
      }, [idx]);

      return (
        <div
          className="fi"
          style={{
            background: 'rgba(255,255,255,0.04)',
            border: '1px solid rgba(255,255,255,0.08)',
            borderRadius: 16,
            padding: '18px 14px',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            gap: 10,
            backdropFilter: 'blur(12px)',
            transition: 'border-color 0.2s',
            cursor: 'default',
            animationDelay: `${idx * 0.06}s`,
          }}
          onMouseEnter={e => e.currentTarget.style.borderColor = item.color + '55'}
          onMouseLeave={e => e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)'}
        >
          <div style={{ position: 'relative', width: 80, height: 80 }}>
            <Ring val={visible ? value : 0} color={item.color} />
            <div style={{
              position: 'absolute', inset: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column'
            }}>
              <span style={{ fontSize: 18, lineHeight: 1 }}>{item.icon}</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: item.color, fontFamily: 'JetBrains Mono, monospace' }}>
                {visible ? value : 0}
              </span>
            </div>
          </div>
          <span style={{
            fontSize: 12, color: 'rgba(255,255,255,.55)',
            textAlign: 'center', letterSpacing: '.04em'
          }}>
            {item.label.toUpperCase()}
          </span>
        </div>
      );
    }

    // liten waveform-animation baserad på energinivå
    function Wave({ energy }) {
      return (
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 20 }}>
          {Array.from({ length: 12 }, (_, i) => {
            const h = Math.max(3, Math.round((energy / 100) * 16 * (0.4 + 0.6 * Math.sin((i / 12) * Math.PI + 0.5))));
            const opacity = 0.4 + (energy / 100) * 0.6;
            return <div key={i} style={{ width: 3, height: h, borderRadius: 2, background: `rgba(29,185,84,${opacity})` }} />;
          })}
        </div>
      );
    }

    function ChartTooltip({ active, payload, label }) {
      if (!active || !payload?.length) return null;
      return (
        <div style={{
          background: 'rgba(10,8,20,.95)',
          border: '1px solid rgba(255,255,255,.1)',
          borderRadius: 10,
          padding: '10px 14px',
        }}>
          <p style={{ color: 'rgba(255,255,255,.5)', fontSize: 12, margin: '0 0 6px', fontFamily: 'JetBrains Mono, monospace' }}>{label}</p>
          {payload.map(p => (
            <p key={p.name} style={{ color: p.stroke, fontSize: 13, margin: 0, fontWeight: 600 }}>
              {p.name}: {p.value}
            </p>
          ))}
        </div>
      );
    }

    function Section({ title, children }) {
      return (
        <section style={{ marginBottom: 40 }}>
          <h2 style={{
            fontSize: 13, fontWeight: 600,
            color: 'rgba(255,255,255,.35)',
            letterSpacing: '.12em',
            textTransform: 'uppercase',
            marginBottom: 16,
          }}>
            {title}
          </h2>
          {children}
        </section>
      );
    }

    function GlassCard({ children, style = {}, border = '' }) {
      return (
        <div style={{
          background: 'rgba(255,255,255,.03)',
          border: `1px solid ${border || 'rgba(255,255,255,.07)'}`,
          borderRadius: 20,

      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        const W = canvas.width, H = canvas.height;

        const particles = Array.from({ length: 55 }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.4 + 0.3,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          col: [G, CY, PU, PK][Math.floor(Math.random() * 4)],
          a: Math.random() * 0.5 + 0.15,
        }));

        let frameId;
        const draw = () => {
          ctx.clearRect(0, 0, W, H);
          for (const p of particles) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
            if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.col + Math.round(p.a * 255).toString(16).padStart(2, '0');
            ctx.fill();
          }
          // linjer mellan nära partiklar
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
              if (dist < 90) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(29,185,84,${(1 - dist / 90) * 0.07})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          }
          frameId = requestAnimationFrame(draw);
        };
        draw();
        return () => cancelAnimationFrame(frameId);
      }, []);

                      </div>
                      <div style={{ fontSize: 20, fontWeight: 700, color: s.color, marginBottom: 4, wordBreak: 'break-word' }}>{s.value}</div>
                      <div style={{ fontSize: 12, color: 'rgba(255,255,255,.35)' }}>{s.sub}</div>
                    </div>
                  ))}
                </div>
              </Section>

              <Section title={`Top Artists · ${topArtists.items?.length || 0}`}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: 12 }}>
                  {(topArtists.items || []).slice(0, 12).map((artist, i) => (
                    <div key={artist.id} className="fi" style={{
                      background: 'rgba(255,255,255,.03)',
                      border: '1px solid rgba(255,255,255,.07)',
                      borderRadius: 14, padding: 16, textAlign: 'center',
                      backdropFilter: 'blur(12px)', animationDelay: `${i * 0.04}s`,
                    }}>
                      {artist.images?.[0]?.url
                        ? <img src={artist.images[0].url} style={{ width: 56, height: 56, borderRadius: '50%', objectFit: 'cover', marginBottom: 10 }} alt="" />
                        : <div style={{
                          width: 56, height: 56, borderRadius: '50%',
                          background: `linear-gradient(135deg,${PALETTE[i % 5]}44,${PALETTE[(i + 1) % 5]}22)`,
                          margin: '0 auto 10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22,
                        }}>🎤</div>
                      }
                      <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                        {artist.name}
                      </div>
                      <div style={{ fontSize: 11, color: 'rgba(255,255,255,.35)', marginTop: 4, fontFamily: 'JetBrains Mono, monospace' }}>
                        {artist.popularity}% pop.
                      </div>
                    </div>
                  ))}
                </div>
              </Section>
            </>}

            {/* SOCIAL */}
            {tab === 'social' && (
              <Section title="Social Match">
                <GlassCard style={{ textAlign: 'center', marginBottom: 20 }}>
                  <div style={{ fontSize: 60, marginBottom: 16 }}>🎭</div>
                  <div style={{ fontSize: 13, color: 'rgba(255,255,255,.35)', fontFamily: 'JetBrains Mono, monospace', letterSpacing: '.1em', marginBottom: 20 }}>
                    DITT NÄRMASTE MATCH
                  </div>
                  <div style={{
                    display: 'inline-block',
                    background: `linear-gradient(135deg,${PU}22,${CY}22)`,
                    border: `1px solid ${PU}44`,
                    borderRadius: 16, padding: '16px 32px', marginBottom: 20,
                  }}>
                    <div style={{ fontSize: 42, fontWeight: 800 }}>
                      {moodObj.energy > 70 && ms < 50 ? '87%' : moodObj.chill > 60 ? '82%' : '79%'}
                    </div>
                    <div style={{ fontSize: 15, color: CY, fontFamily: 'JetBrains Mono, monospace', marginTop: 4 }}>
                      {moodObj.energy > 70 ? 'Intensitets-lyssnare' : moodObj.chill > 60 ? 'Ambient-utforskare' : 'Indie-nörd'}
                    </div>
                  </div>
                  <p style={{ color: 'rgba(255,255,255,.5)', fontSize: 14, lineHeight: 1.7, maxWidth: 500, margin: '0 auto' }}>
                    Baserat på din musikprofil — {moodObj.happiness}% happiness, {moodObj.energy}% energy, {ms}% mainstream.
                  </p>
                </GlassCard>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 14 }}>
                  {[
                    {
                      type: moodObj.energy > 65 ? 'Energy Seeker' : 'Calm Explorer',
                      match: Math.min(98, (moodObj.energy > 65 ? 88 : 78) + Math.round(Math.max(moodObj.energy, moodObj.chill) / 12)),
                      icon: moodObj.energy > 65 ? '⚡' : '🌊',
                    },
                    {
                      type: ms < 45 ? 'Underground Nerd' : 'Trendsetter',
                      match: Math.min(98, (ms < 45 ? 85 : 72) + Math.round((ms < 45 ? 100 - ms : ms) / 12)),
                      icon: ms < 45 ? '🔍' : '📈',
                    },
                    {
                      type: moodObj.focus > 55 ? 'Complexity Lover' : 'Vibe Chaser',
                      match: Math.min(98, (moodObj.focus > 55 ? 80 : 70) + Math.round(Math.max(moodObj.focus, moodObj.happiness) / 12)),
                      icon: moodObj.focus > 55 ? '🧩' : '🎉',
                    },
                  ].map(m => (
                    <div key={m.type} style={{
                      background: 'rgba(255,255,255,.03)',
                      border: '1px solid rgba(255,255,255,.07)',
                      borderRadius: 16, padding: 20, textAlign: 'center',
                      backdropFilter: 'blur(12px)',
                    }}>
                      <div style={{ fontSize: 32, marginBottom: 10 }}>{m.icon}</div>
                      <div style={{ fontSize: 20, fontWeight: 700, color: G }}>{m.match}%</div>
                      <div style={{ fontSize: 12, color: 'rgba(255,255,255,.45)', marginTop: 6 }}>{m.type}</div>
                    </div>
                  ))}
                </div>
              </Section>
            )}

          </div>
        </div>
      );
    }

    function App() {
      const [phase, setPhase] = useState('init');
      const [data, setData] = useState(null);
      const [error, setError] = useState('');
      const [status, setStatus] = useState('Laddar...');
      const [loginLoading, setLoginLoading] = useState(false);
      const [timeRange, setTimeRange] = useState('medium_term');
      const [recentH, setRecentH] = useState(null);
      const tokenRef = useRef(null);

      const logout = () => {
        clearAuth();
        setData(null);
        setError('');
        setPhase('login');
      };

      const fetchData = async (token, tr, rh) => {
        tokenRef.current = token;
        setPhase('loading');
        try {
          const raw = await loadAll(token, setStatus, tr || 'medium_term', rh || null);
          setData(raw);
          setPhase('dashboard');
        } catch (e) {
          setError(e.message);
          setPhase('login');
        }
      };

      const refetch = async (tr, rh) => {
        const token = tokenRef.current || await getToken();
        if (!token) { setPhase('login'); return; }
        await fetchData(token, tr, rh);
      };

      const handleLogin = async () => {
        if (CLIENT_ID === 'DIN_CLIENT_ID_HÄR') {
          setError('Öppna index.html och ersätt DIN_CLIENT_ID_HÄR med ditt Spotify Client ID.');
          return;
        }
        setLoginLoading(true);
        await startLogin();
      };

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const err = params.get('error');

        if (err) {
          window.history.replaceState({}, '', window.location.pathname);
          setError('Spotify nekade inloggning: ' + err);
          setPhase('login');
          return;
        }

        if (code) {
          window.history.replaceState({}, '', window.location.pathname);
          setPhase('loading');
          setStatus('Byter kod mot token...');
          exchangeCode(code)
            .then(t => fetchData(t, 'medium_term', null))
            .catch(e => { setError(e.message); setPhase('login'); });
          return;
        }

        // kolla om vi redan är inloggade
        getToken().then(t => {
          if (t) fetchData(t, 'medium_term', null);
          else setPhase('login');
        });
      }, []);

      if (phase === 'init' || phase === 'loading') return <Loading status={status} />;
      if (phase === 'dashboard' && data) {
        return (
          <Dashboard
            data={data}
            onLogout={logout}
            timeRange={timeRange}
            recentH={recentH}
            onTimeChange={(tr, rh) => { setTimeRange(tr); setRecentH(rh); refetch(tr, rh); }}
          />
        );
      }
      return <Login onLogin={handleLogin} error={error} loading={loginLoading} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
