<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodify — Spotify Mood Analyzer</title>
  <!--
  ╔══════════════════════════════════════════════════════╗
  ║              MOODIFY — SETUP-INSTRUKTIONER           ║
  ╠══════════════════════════════════════════════════════╣
  ║  1. Gå till https://developer.spotify.com/dashboard  ║
  ║  2. Klicka "Create app"                              ║
  ║  3. Fyll i valfritt namn, välj "Web API"             ║
  ║  4. Under "Redirect URIs" — lägg till EXAKT:         ║
  ║       https://DITT-USERNAME.github.io/DITT-REPO/     ║
  ║  5. Spara → kopiera "Client ID" härifrån             ║
  ║  6. Byt ut DIN_CLIENT_ID_HÄR nedanför mot ditt ID    ║
  ║  7. Pusha index.html → aktivera GitHub Pages         ║
  ║                                                      ║
  ║  OBS: Appen kör i "Development Mode" — lägg till     ║
  ║  din Spotify-mejl som testanvändare i dashboarden    ║
  ║  (Settings → User Management) innan du testar.       ║
  ╚══════════════════════════════════════════════════════╝
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    body { background: #05040A; font-family: 'Syne', sans-serif; color: white; }
    @keyframes spin   { to   { transform: rotate(360deg); } }
    @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .fi { animation: fadein 0.45s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const {
      RadarChart, Radar, PolarGrid, PolarAngleAxis,
      PieChart, Pie, Cell,
      AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer,
    } = Recharts;

    /* ═══════════════════════════════════════════════════
       CONFIG  — byt ut mot ditt Client ID
       ═══════════════════════════════════════════════════ */
    const CLIENT_ID    = '7eea2c95553c4c87b75e3a1fd8ca1a12';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES       = 'user-top-read user-read-recently-played user-read-private user-read-email';

    /* ═══════════════════════════════════════════════════
       PKCE HELPERS
       ═══════════════════════════════════════════════════ */
    function randStr(n) {
      const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const b = new Uint8Array(n);
      crypto.getRandomValues(b);
      return Array.from(b, x => c[x % c.length]).join('');
    }
    async function pkce(v) {
      const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
      return btoa(String.fromCharCode(...new Uint8Array(d)))
        .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    }

    /* ═══════════════════════════════════════════════════
       AUTH FLOW
       ═══════════════════════════════════════════════════ */
    async function startLogin() {
      const verifier = randStr(64);
      localStorage.setItem('mfy_v', verifier);
      const p = new URLSearchParams({
        client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
        code_challenge_method: 'S256', code_challenge: await pkce(verifier),
        scope: SCOPES, show_dialog: 'false',
      });
      window.location.href = 'https://accounts.spotify.com/authorize?' + p;
    }

    function spotifyTokenError(d, status) {
      const raw = d.error_description || d.error || '';
      if (status === 403 || raw.toLowerCase().includes('403'))
        return `403 Forbidden — Redirect URI matchar inte. ` +
               `Appen använder: "${REDIRECT_URI}". ` +
               `Kontrollera att exakt denna URI är inlagd under Redirect URIs i ditt Spotify-app.`;
      if (raw.toLowerCase().includes('invalid_client'))
        return `Ogiltigt Client ID. Kontrollera att CLIENT_ID i index.html är korrekt.`;
      if (raw.toLowerCase().includes('invalid_grant'))
        return `Koden har redan använts eller löpt ut. Prova att logga in igen.`;
      if (raw.toLowerCase().includes('not_found') || status === 404)
        return `Appen hittades inte på Spotify. Kontrollera Client ID.`;
      return raw || `Fel ${status} från Spotify`;
    }

    async function exchangeCode(code) {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID, grant_type: 'authorization_code',
          code, redirect_uri: REDIRECT_URI, code_verifier: localStorage.getItem('mfy_v'),
        }),
      });
      const d = await res.json();
      if (!d.access_token) throw new Error(spotifyTokenError(d, res.status));
      saveTokens(d);
      localStorage.removeItem('mfy_v');
      window.history.replaceState({}, '', window.location.pathname);
      return d.access_token;
    }

    async function doRefresh() {
      const rt = localStorage.getItem('mfy_rt');
      if (!rt) throw new Error('Ingen refresh token');
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: rt }),
      });
      const d = await res.json();
      if (!d.access_token) throw new Error(spotifyTokenError(d, res.status));
      saveTokens(d);
      return d.access_token;
    }

    function saveTokens({ access_token, expires_in, refresh_token }) {
      localStorage.setItem('mfy_at',  access_token);
      localStorage.setItem('mfy_exp', Date.now() + expires_in * 1000);
      if (refresh_token) localStorage.setItem('mfy_rt', refresh_token);
    }

    async function getToken() {
      const at = localStorage.getItem('mfy_at');
      if (at && Date.now() < parseInt(localStorage.getItem('mfy_exp')||0) - 60000) return at;
      try { return await doRefresh(); } catch { clearAuth(); return null; }
    }

    function clearAuth() {
      ['mfy_at','mfy_exp','mfy_rt','mfy_v'].forEach(k => localStorage.removeItem(k));
    }

    /* ═══════════════════════════════════════════════════
       SPOTIFY API
       ═══════════════════════════════════════════════════ */
    async function sp(token, path) {
      const r = await fetch('https://api.spotify.com/v1' + path, {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (r.status === 401) { clearAuth(); throw new Error('Session utgången — logga in igen'); }
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error?.message || 'HTTP '+r.status); }
      return r.json();
    }

    async function loadAll(token, onStatus) {
      onStatus('Hämtar din profil och topplåtar...');
      const [me, topTracks, topArtists, recent] = await Promise.all([
        sp(token, '/me'),
        sp(token, '/me/top/tracks?time_range=medium_term&limit=50'),
        sp(token, '/me/top/artists?time_range=medium_term&limit=50'),
        sp(token, '/me/player/recently-played?limit=50').catch(()=>({ items:[] })),
      ]);
      onStatus('Bearbetar din musikdata...');
      // NOTE: /audio-features is deprecated for apps created after Nov 2024.
      // All mood scores are now derived from genres + popularity instead.
      return { me, topTracks, topArtists, recent };
    }

    /* ═══════════════════════════════════════════════════
       DATA CRUNCHING  (no audio-features needed)
       ═══════════════════════════════════════════════════ */

    // Genre → mood weights
    const GENRE_MOOD = {
      // [energy, happiness, danceability, acoustic, complex]
      'pop':           [0.65, 0.75, 0.72, 0.25, 0.30],
      'dance':         [0.82, 0.72, 0.88, 0.10, 0.35],
      'edm':           [0.88, 0.65, 0.84, 0.05, 0.50],
      'electronic':    [0.78, 0.58, 0.75, 0.08, 0.60],
      'house':         [0.80, 0.68, 0.85, 0.08, 0.45],
      'techno':        [0.85, 0.45, 0.80, 0.05, 0.65],
      'hip hop':       [0.72, 0.62, 0.82, 0.12, 0.55],
      'rap':           [0.74, 0.58, 0.80, 0.10, 0.60],
      'trap':          [0.76, 0.50, 0.78, 0.08, 0.55],
      'r&b':           [0.58, 0.68, 0.72, 0.28, 0.50],
      'rock':          [0.78, 0.52, 0.55, 0.22, 0.55],
      'metal':         [0.90, 0.35, 0.45, 0.08, 0.72],
      'punk':          [0.88, 0.50, 0.60, 0.15, 0.48],
      'indie':         [0.55, 0.58, 0.58, 0.48, 0.62],
      'alternative':   [0.60, 0.52, 0.55, 0.38, 0.60],
      'post-rock':     [0.60, 0.42, 0.35, 0.40, 0.80],
      'math rock':     [0.65, 0.48, 0.40, 0.35, 0.88],
      'ambient':       [0.22, 0.48, 0.28, 0.68, 0.72],
      'classical':     [0.30, 0.62, 0.28, 0.88, 0.82],
      'jazz':          [0.42, 0.65, 0.58, 0.72, 0.85],
      'blues':         [0.48, 0.52, 0.55, 0.65, 0.68],
      'folk':          [0.38, 0.62, 0.48, 0.80, 0.58],
      'country':       [0.52, 0.65, 0.58, 0.72, 0.42],
      'soul':          [0.52, 0.70, 0.65, 0.55, 0.60],
      'funk':          [0.72, 0.72, 0.82, 0.30, 0.65],
      'latin':         [0.72, 0.75, 0.85, 0.30, 0.45],
      'reggae':        [0.52, 0.72, 0.75, 0.55, 0.42],
      'lo-fi':         [0.28, 0.55, 0.55, 0.65, 0.58],
      'experimental':  [0.55, 0.38, 0.42, 0.40, 0.90],
      'shoegaze':      [0.55, 0.42, 0.38, 0.45, 0.75],
    };

    function genreWeights(topArtists) {
      // Returns averaged [energy, happiness, dance, acoustic, complex] from genres
      const scores = { en:[], ha:[], da:[], ac:[], cx:[] };
      (topArtists.items||[]).forEach(a => {
        (a.genres||[]).forEach(g => {
          const gl = g.toLowerCase();
          for (const [kw, w] of Object.entries(GENRE_MOOD)) {
            if (gl.includes(kw)) {
              scores.en.push(w[0]); scores.ha.push(w[1]);
              scores.da.push(w[2]); scores.ac.push(w[3]); scores.cx.push(w[4]);
              break;
            }
          }
        });
      });
      const m = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : 0.5;
      return { en:m(scores.en), ha:m(scores.ha), da:m(scores.da), ac:m(scores.ac), cx:m(scores.cx) };
    }

    function mood(topArtists, ms) {
      const w = genreWeights(topArtists);
      // Popularity modifier: high mainstream → slightly more happy/dance, less complex
      const popBoost = (ms/100) * 0.08;
      const en = Math.min(1, w.en);
      const ha = Math.min(1, w.ha + popBoost);
      const da = Math.min(1, w.da + popBoost * 0.5);
      const ac = w.ac;
      const cx = Math.max(0, w.cx - popBoost);
      return {
        happiness:    Math.round(ha * 100),
        energy:       Math.round(en * 100),
        sadness:      Math.round(((1-ha)*.6 + (1-en)*.4) * 100),
        focus:        Math.round((cx*.55 + ac*.25 + (1-da)*.2) * 100),
        danceability: Math.round(da * 100),
        aggression:   Math.round((en*.45 + (1-ha)*.35 + (1-ac)*.2) * 100),
        chill:        Math.round((ac*.45 + (1-en)*.35 + ha*.2) * 100),
      };
    }

    function radarData(topArtists, ms) {
      const w = genreWeights(topArtists);
      return [
        { s:'Melodic',    A:Math.round(((1-w.en)*.5 + w.ha*.5) * 100) },
        { s:'Intense',    A:Math.round((w.en*.6 + (1-w.ac)*.4) * 100) },
        { s:'Electronic', A:Math.round((1-w.ac) * 100) },
        { s:'Acoustic',   A:Math.round(w.ac * 100) },
        { s:'Complex',    A:Math.round(w.cx * 100) },
        { s:'Mainstream', A:Math.round(ms) },
      ];
    }

    const GBUCKETS = {
      'Pop':['pop','chart','teen','viral'],
      'Rock':['rock','metal','punk','grunge','emo','hardcore'],
      'Electronic':['electronic','electro','techno','house','edm','synth','trance','dubstep','ambient','idm','dnb','drum'],
      'Hip-Hop':['hip hop','hip-hop','rap','trap','drill','r&b','rnb'],
      'Indie Alt':['indie','alternative','lo-fi','lo fi','shoegaze','dreampop'],
      'Post-Rock':['post-rock','post rock','math rock','post metal','noise rock','experimental'],
      'Folk':['folk','singer-songwriter','acoustic','country','americana'],
      'Jazz/Blues':['jazz','blues','funk','soul','gospel'],
    };

    function genreData(topArtists) {
      const c={};
      (topArtists.items||[]).forEach(a=>(a.genres||[]).forEach(g=>{
        const gl=g.toLowerCase();
        for(const [b,kws] of Object.entries(GBUCKETS)) if(kws.some(k=>gl.includes(k))){ c[b]=(c[b]||0)+1; break; }
      }));
      const tot=Math.max(1,Object.values(c).reduce((s,v)=>s+v,0));
      return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6)
        .map(([n,v],i)=>({ name:n, value:Math.round((v/tot)*100), color:[PU,CY,G,OR,PK,'#888'][i] }));
    }

    function trendData(items) {
      const DAYS=["Sön","Mån","Tis","Ons","Tor","Fre","Lör"], days={};
      (items||[]).forEach(item=>{
        if(!item.played_at||!item.track) return;
        const d=new Date(item.played_at),
              k=`${d.getFullYear()}-${String(d.getMonth()).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        if(!days[k]) days[k]={ label:DAYS[d.getDay()], pops:[] };
        days[k].pops.push(item.track.popularity||50);
      });
      return Object.entries(days).sort(([a],[b])=>a.localeCompare(b)).slice(-7)
        .map(([,v])=>{
          const ap=v.pops.length?v.pops.reduce((s,p)=>s+p,0)/v.pops.length:50;
          return { day:v.label, energy:Math.round(40+ap*.55), happiness:Math.round(35+ap*.6) };
        });
    }

    function mainstream(ta) {
      const it=ta.items||[]; if(!it.length) return 50;
      return Math.round(it.reduce((s,a)=>s+a.popularity,0)/it.length);
    }

    function personality(m,ms) {
      const time  = m.energy>65?'dagslyssnare':'nattlyssnare';
      const type  = m.focus>55?'analytisk':'känslodriven';
      const main  = ms<35?'undviker mainstream med precision':ms<65?'balanserar mainstream och nisch':'embracar populärkultur';
      const vibe  = m.energy>70?'hög intensitet':m.chill>65?'lugn och atmosfärisk stil':'varierad dynamik';
      const depth = m.focus>60?'emotionellt komplex musik':'välproducerad melodisk musik';
      return `Du är en ${type} ${time} som ${main} och graviterar mot ${depth} med ${vibe}.`;
    }

    function tags(m,ms) {
      return [
        m.energy>70?'Hög energi':m.chill>60?'Chill lyssnare':'Balanserad',
        ms<35?'Anti-mainstream':ms>70?'Mainstream':'Nisch-nörd',
        m.focus>60?'Komplex smak':'Melodisk smak',
        m.happiness>60?'Positiv vibe':'Mörk vibe',
      ];
    }

    function funStats(topTracks,topArtists,ms) {
      const tracks=topTracks.items||[], artists=topArtists.items||[];
      // Without audio-features: use popularity as proxy for energy/sadness
      const least = tracks.slice().sort((a,b)=>a.popularity-b.popularity)[0];
      const most  = tracks.slice().sort((a,b)=>b.popularity-a.popularity)[0];
      const obs   = artists.slice().sort((a,b)=>a.popularity-b.popularity)[0];
      const hg    = Math.round((1-ms/100)*100);
      const iq    = Math.min(160,Math.round(80+hg*.55+(100-ms)*.25));
      return [
        { label:"Mainstream %",      value:`${ms}%`,             sub:ms<40?"Indie af":ms<70?"Balanced":"Mainstream enjoyer", color:CY },
        { label:"Hidden Gem Score",  value:String(hg),           sub:hg>70?"Top underground":"Underground nörd",             color:PU },
        { label:"Musik-IQ",          value:String(iq),           sub:"Komplexitetsnörd",                                    color:G  },
        { label:"Minst populär låt", value:least?.name||"—",     sub:least?(least.artists||[{}])[0].name||"":"",            color:PK },
        { label:"Mest populär låt",  value:most?.name||"—",      sub:most?(most.artists||[{}])[0].name||"":"",              color:OR },
        { label:"Mest ovanliga",     value:obs?.name||"—",       sub:obs?`${obs.popularity}% popularitet`:"",               color:"#FF4444" },
      ];
    }

    /* ═══════════════════════════════════════════════════
       DESIGN TOKENS
       ═══════════════════════════════════════════════════ */
    const G='#1DB954',CY='#00D9F5',PU='#B026FF',PK='#FF2D78',OR='#FF6B35';
    const MOOD_META=[
      {key:'happiness',    label:'Happiness',    color:G,         icon:'☀' },
      {key:'energy',       label:'Energy',       color:OR,        icon:'⚡'},
      {key:'sadness',      label:'Sadness',      color:CY,        icon:'🌧'},
      {key:'focus',        label:'Focus',        color:PU,        icon:'◎' },
      {key:'danceability', label:'Danceability', color:PK,        icon:'♫' },
      {key:'aggression',   label:'Aggression',   color:'#FF4444', icon:'🔥'},
      {key:'chill',        label:'Chill',        color:'#44DDBB', icon:'✦' },
    ];

    /* ═══════════════════════════════════════════════════
       SMALL UI COMPONENTS
       ═══════════════════════════════════════════════════ */
    function Ring({val,color,size=80}) {
      const r=(size-12)/2, c=2*Math.PI*r;
      return (
        <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={6}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={6}
            strokeDasharray={`${(val/100)*c} ${(1-val/100)*c}`} strokeLinecap="round"
            style={{transition:'stroke-dasharray 1.3s cubic-bezier(0.34,1.56,0.64,1)'}}/>
        </svg>
      );
    }

    function MoodCard({item,idx,value}) {
      const [show,setShow]=useState(false);
      useEffect(()=>{const t=setTimeout(()=>setShow(true),150+idx*70);return()=>clearTimeout(t);},[idx]);
      return (
        <div className="fi" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',
          borderRadius:16,padding:'18px 14px',display:'flex',flexDirection:'column',
          alignItems:'center',gap:10,backdropFilter:'blur(12px)',transition:'border-color 0.2s',cursor:'default',
          animationDelay:`${idx*.06}s`}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=item.color+'55'}
          onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}>
          <div style={{position:'relative',width:80,height:80}}>
            <Ring val={show?value:0} color={item.color}/>
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>
              <span style={{fontSize:18,lineHeight:1}}>{item.icon}</span>
              <span style={{fontSize:13,fontWeight:700,color:item.color,fontFamily:'JetBrains Mono,monospace'}}>{show?value:0}</span>
            </div>
          </div>
          <span style={{fontSize:12,color:'rgba(255,255,255,.55)',textAlign:'center',letterSpacing:'.04em'}}>{item.label.toUpperCase()}</span>
        </div>
      );
    }

    function Wave({energy}) {
      return (
        <div style={{display:'flex',alignItems:'flex-end',gap:2,height:20}}>
          {Array.from({length:12},(_,i)=>{
            const h=Math.max(3,Math.round((energy/100)*16*(.4+.6*Math.sin((i/12)*Math.PI+.5))));
            return <div key={i} style={{width:3,height:h,borderRadius:2,background:`rgba(29,185,84,${.4+(energy/100)*.6})`}}/>;
          })}
        </div>
      );
    }

    function Tip({active,payload,label}) {
      if(!active||!payload?.length) return null;
      return (
        <div style={{background:'rgba(10,8,20,.95)',border:'1px solid rgba(255,255,255,.1)',borderRadius:10,padding:'10px 14px'}}>
          <p style={{color:'rgba(255,255,255,.5)',fontSize:12,margin:'0 0 6px',fontFamily:'JetBrains Mono,monospace'}}>{label}</p>
          {payload.map(p=><p key={p.name} style={{color:p.stroke,fontSize:13,margin:0,fontWeight:600}}>{p.name}: {p.value}</p>)}
        </div>
      );
    }

    function Section({title,children}) {
      return (
        <section style={{marginBottom:40}}>
          <h2 style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,.35)',letterSpacing:'.12em',textTransform:'uppercase',marginBottom:16}}>{title}</h2>
          {children}
        </section>
      );
    }

    function GlassCard({children,style={},border=''}) {
      return <div style={{background:'rgba(255,255,255,.03)',border:`1px solid ${border||'rgba(255,255,255,.07)'}`,borderRadius:20,padding:24,backdropFilter:'blur(12px)',...style}}>{children}</div>;
    }

    /* ═══════════════════════════════════════════════════
       LOGIN
       ═══════════════════════════════════════════════════ */
    function Login({onLogin,error,loading}) {
      const cvs=useRef(null);
      useEffect(()=>{
        const c=cvs.current; if(!c) return;
        const ctx=c.getContext('2d'); let id;
        c.width=c.offsetWidth; c.height=c.offsetHeight;
        const W=c.width,H=c.height;
        const pts=Array.from({length:55},()=>({
          x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,
          vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,
          col:[G,CY,PU,PK][0|Math.random()*4],a:Math.random()*.5+.15,
        }));
        const draw=()=>{
          ctx.clearRect(0,0,W,H);
          pts.forEach(p=>{
            p.x+=p.vx;p.y+=p.vy;
            if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=p.col+Math.round(p.a*255).toString(16).padStart(2,'0');ctx.fill();
          });
          pts.forEach((p,i)=>{
            for(let j=i+1;j<pts.length;j++){
              const q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);
              if(d<90){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);
                ctx.strokeStyle=`rgba(29,185,84,${(1-d/90)*.07})`;ctx.lineWidth=.5;ctx.stroke();}
            }
          });
          id=requestAnimationFrame(draw);
        };
        draw();
        return()=>cancelAnimationFrame(id);
      },[]);

      return (
        <div style={{minHeight:'100vh',background:'#05040A',display:'flex',alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden'}}>
          <canvas ref={cvs} style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:.6}}/>
          <div style={{position:'absolute',width:500,height:500,borderRadius:'50%',background:`radial-gradient(circle,${PU}18 0%,transparent 70%)`,top:'5%',left:'55%',filter:'blur(50px)',pointerEvents:'none'}}/>

            <div style={{textAlign:'center'}}>

              <div style={{fontSize:14,color:'rgba(255,255,255,.4)',fontFamily:'JetBrains Mono,monospace',letterSpacing:'.1em'}}>SPOTIFY MOOD ANALYZER</div>

              <p style={{color:'rgba(255,255,255,.45)',fontSize:14,lineHeight:1.65,margin:'0 0 28px'}}>
                Logga in med ditt Spotify-konto för att analysera din musiksmak på riktigt och se din unika musikpersonlighet.
              </p>
              {error&&(
                <div style={{background:'rgba(255,50,50,.08)',border:'1px solid rgba(255,80,80,.3)',borderRadius:12,padding:'14px 16px',marginBottom:20,textAlign:'left'}}>
                  <div style={{fontSize:13,color:'#ff8080',lineHeight:1.6,marginBottom:10}}>⚠ {error}</div>
                  {error.includes('Redirect URI') && (
                    <div style={{background:'rgba(0,0,0,.3)',borderRadius:8,padding:'10px 12px'}}>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.3)',fontFamily:'JetBrains Mono,monospace',marginBottom:6}}>LÄGG TILL EXAKT DENNA URI I SPOTIFY DASHBOARD:</div>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <code style={{fontSize:12,color:CY,fontFamily:'JetBrains Mono,monospace',wordBreak:'break-all',flex:1}}>{REDIRECT_URI}</code>
                        <button onClick={()=>navigator.clipboard.writeText(REDIRECT_URI)} style={{background:`${CY}22`,border:`1px solid ${CY}44`,color:CY,borderRadius:6,padding:'4px 8px',fontSize:11,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'JetBrains Mono,monospace'}}>Kopiera</button>
                      </div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.3)',marginTop:8,lineHeight:1.5}}>
                        Gå till <span style={{color:G}}>developer.spotify.com/dashboard</span> → din app → Edit → Redirect URIs → klistra in ovan → Save
                      </div>
                    </div>
                  )}
                </div>
              )}
              <button onClick={onLogin} disabled={loading} style={{
                width:'100%',padding:'14px 0',borderRadius:12,border:'none',
                background:loading?'rgba(29,185,84,.25)':G, color:loading?G:'#000',
                fontSize:15,fontWeight:700,cursor:loading?'default':'pointer',
                fontFamily:'Syne,sans-serif',letterSpacing:'.02em',transition:'all .2s',
                display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
                {loading
                  ? <span style={{display:'inline-block',animation:'spin 1s linear infinite',fontSize:20}}>⟳</span>
                  : <><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>Logga in med Spotify</>}
              </button>
              <div style={{marginTop:14,background:'rgba(0,0,0,.25)',borderRadius:8,padding:'10px 12px',textAlign:'left'}}>
                <div style={{fontSize:10,color:'rgba(255,255,255,.25)',fontFamily:'JetBrains Mono,monospace',marginBottom:4}}>AKTIV REDIRECT URI (kopiera in i Spotify Dashboard)</div>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <code style={{fontSize:11,color:'rgba(255,255,255,.45)',fontFamily:'JetBrains Mono,monospace',wordBreak:'break-all',flex:1}}>{REDIRECT_URI}</code>
                  <button onClick={()=>navigator.clipboard.writeText(REDIRECT_URI)} style={{background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',color:'rgba(255,255,255,.4)',borderRadius:5,padding:'3px 7px',fontSize:10,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'JetBrains Mono,monospace'}}>Kopiera</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

            </Section>}

            {/* STATS */}
            {tab==='stats'&&<>

                  {type:moodObj.energy>65?'Energy Seeker':'Calm Explorer',    match:Math.min(98,(moodObj.energy>65?88:78)+Math.round(Math.max(moodObj.energy,moodObj.chill)/12)), icon:moodObj.energy>65?'⚡':'🌊'},
                  {type:ms<45?'Underground Nerd':'Trendsetter',               match:Math.min(98,(ms<45?85:72)+Math.round((ms<45?100-ms:ms)/12)),                                icon:ms<45?'🔍':'📈'},
                  {type:moodObj.focus>55?'Complexity Lover':'Vibe Chaser',    match:Math.min(98,(moodObj.focus>55?80:70)+Math.round(Math.max(moodObj.focus,moodObj.happiness)/12)),icon:moodObj.focus>55?'🧩':'🎉'},
                ].map(m=>(
                  <div key={m.type} style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.07)',borderRadius:16,padding:20,textAlign:'center',backdropFilter:'blur(12px)'}}>
                    <div style={{fontSize:32,marginBottom:10}}>{m.icon}</div>
                    <div style={{fontSize:20,fontWeight:700,color:G}}>{m.match}%</div>
                    <div style={{fontSize:12,color:'rgba(255,255,255,.45)',marginTop:6}}>{m.type}</div>
                  </div>
                ))}
              </div>
            </Section>}

          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════
       APP ROOT
       ═══════════════════════════════════════════════════ */
    function App() {
      const [phase,  setPhase]  = useState('init');
      const [data,   setData]   = useState(null);
      const [error,  setError]  = useState('');
      const [status, setStatus] = useState('Laddar...');
      const [ll,     setLL]     = useState(false);

      const logout = () => { clearAuth(); setData(null); setError(''); setPhase('login'); };

      const fetch2 = async (token) => {
        setPhase('loading');
        try {
          const raw = await loadAll(token, setStatus);
          setData(raw); setPhase('dashboard');
        } catch(e) { setError(e.message); setPhase('login'); }
      };

      const handleLogin = async () => {
        if (CLIENT_ID === 'DIN_CLIENT_ID_HÄR') {
          setError('Öppna index.html och byt ut DIN_CLIENT_ID_HÄR mot ditt Spotify Client ID.');
          return;
        }
        setLL(true);
        await startLogin();
      };

      useEffect(()=>{
        const p=new URLSearchParams(window.location.search);
        const code=p.get('code'), err=p.get('error');
        if(err){ window.history.replaceState({},'',window.location.pathname); setError('Spotify nekade: '+err); setPhase('login'); return; }
        if(code){
          window.history.replaceState({},'',window.location.pathname);
          setPhase('loading'); setStatus('Byter kod mot token...');
          exchangeCode(code).then(t=>fetch2(t)).catch(e=>{setError(e.message);setPhase('login');});
          return;
        }
        getToken().then(t=>{ if(t) fetch2(t); else setPhase('login'); });
      },[]);

      if(phase==='init'||phase==='loading') return <Loading status={status}/>;
      if(phase==='dashboard'&&data)         return <Dashboard data={data} onLogout={logout}/>;
      return <Login onLogin={handleLogin} error={error} loading={ll}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
